<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="left-bar-pattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e00020" stroke-width="1.3"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <rect x="0" y="0" width="42" height="900" fill="url(#left-bar-pattern)"/>
  <image href="data:image/png;base64," x="1268" y="22" width="292" height="105"/>


  <text x="126" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="400" fill="#000000">
    Preparation For AI
  </text>
  <text x="126" y="262" font-family="Arial, sans-serif" font-size="52" font-weight="400" fill="#000000">
    From Raw Data To Reliable Models
  </text>

  <g transform="translate(126 366)">
    <g font-family="Arial, sans-serif" font-size="34" fill="#000000">
      <rect x="0" y="0" width="260" height="122" fill="#ffffff" stroke="#000000" stroke-width="3"/>
      <text x="34" y="52">raw data</text>
      <text x="34" y="94" fill="#000000" font-size="30">files, streams</text>

      <path d="M280 61 H330" stroke="#e00020" stroke-width="6"/>
      <path d="M330 61 L308 48 M330 61 L308 74" stroke="#e00020" stroke-width="6" fill="none"/>

      <rect x="350" y="0" width="290" height="122" fill="#ffffff" stroke="#000000" stroke-width="3"/>
      <text x="384" y="52">lakehouse</text>
      <text x="384" y="94" fill="#000000" font-size="30">object storage</text>

      <path d="M660 61 H710" stroke="#e00020" stroke-width="6"/>
      <path d="M710 61 L688 48 M710 61 L688 74" stroke="#e00020" stroke-width="6" fill="none"/>

      <rect x="730" y="0" width="290" height="122" fill="#ffffff" stroke="#000000" stroke-width="3"/>
      <text x="764" y="52">workflows</text>
      <text x="764" y="94" fill="#000000" font-size="30">Airflow, tables</text>

      <path d="M1040 61 H1090" stroke="#e00020" stroke-width="6"/>
      <path d="M1090 61 L1068 48 M1090 61 L1068 74" stroke="#e00020" stroke-width="6" fill="none"/>

      <rect x="1110" y="0" width="310" height="122" fill="#ffffff" stroke="#000000" stroke-width="3"/>
      <text x="1144" y="52">reliable AI</text>
      <text x="1144" y="94" fill="#000000" font-size="30">models, evidence</text>
    </g>
  </g>

  <g transform="translate(126 590)" font-family="Arial, sans-serif" font-size="40" fill="#000000">
    <text x="0" y="0">A hands-on course about the engineering work</text>
    <text x="0" y="52">before and around model training.</text>
    <text x="0" y="124">Theory, slides, labs, and solutions are included.</text>
  </g>

  <g transform="translate(1156 624) scale(1.25)">
    <g fill="none" stroke="#e00020" stroke-width="8">
      <path d="M86 48 H126 M202 48 H242"/>
      <path d="M48 86 V122 H280 V86"/>
    </g>
    <circle cx="48" cy="48" r="42" fill="#b86f2e"/>
    <circle cx="164" cy="48" r="42" fill="#bfc5cc"/>
    <circle cx="280" cy="48" r="42" fill="#d6a900"/>
    <g font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#000000" text-anchor="middle">
      <text x="48" y="176">bronze</text>
      <text x="164" y="176">silver</text>
      <text x="280" y="176">gold</text>
    </g>
  </g>

</svg>
